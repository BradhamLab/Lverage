[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lverage"
version = "0.2.0.dev0"
description = "Infer transcription factor binding motifs using orthologous species"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "ete3>=3.1.3",
    "py3-validate-email>=1.0.5.post2",
    "requests>=2.32",
    "six>=1.16",
]

[project.optional-dependencies]
docs = [
    "numpydoc>=1.10",
    "pydata-sphinx-theme>=0.16",
    "sphinx>=9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lverage*"]
