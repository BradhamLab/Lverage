[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lverage"
version = "0.2.0.dev0"
description = "Infer transcription factor binding motifs using orthologous species"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "ete3>=3.1.3",
    "py3-validate-email>=1.0.5.post2",
    "requests>=2.32",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lverage*"]
