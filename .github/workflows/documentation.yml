name: Documentation

on:
  pull_request:
  push:
    branches:
      - main
      - refactor-v2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the project and documentation tools
        run: python -m pip install ".[docs]" "numpy>=1.24"

      - name: Run the v2 tests
        run: python -m unittest discover -s tests/v2 -p 'test_*.py' -v

      - name: Run the retained legacy tests
        run: python -m unittest discover -s tests -p 'test_jaspar_window.py' -v

      - name: Build the documentation
        run: sphinx-build -W --keep-going --nitpicky -b html docs docs/_build/html

      - name: Upload the documentation
        uses: actions/upload-artifact@v7
        with:
          name: lverage-documentation
          path: docs/_build/html
          if-no-files-found: error
